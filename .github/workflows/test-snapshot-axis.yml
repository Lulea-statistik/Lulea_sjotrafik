name: Test snapshot dates and AIS axis
on:
  pull_request:
    paths:
      - docs/index.html
      - tests/snapshot-axis.test.cjs
      - .github/workflows/test-snapshot-axis.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/snapshot-axis.test.cjs
