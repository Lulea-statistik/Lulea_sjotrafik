name: Test cruise sorting and port routes
on:
  pull_request:
    paths:
      - docs/index.html
      - tests/cruise-sort-port-routes.test.cjs
      - .github/workflows/test-cruise-sort-port-routes.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/cruise-sort-port-routes.test.cjs
