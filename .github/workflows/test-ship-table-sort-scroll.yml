name: Test ship table sorting and scrolling
on:
  pull_request:
    paths:
      - docs/index.html
      - tests/ship-table-sort-scroll.test.cjs
      - .github/workflows/test-ship-table-sort-scroll.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/ship-table-sort-scroll.test.cjs
