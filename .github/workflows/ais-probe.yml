name: AIS coverage pilot
on:
  schedule:
    # Daytime priority in UTC; daylight hours vary greatly in Lulea.
    - cron: '13 6-17 * * *'
    # Night observations prevent daytime-only sample bias.
    - cron: '13 0,3,18,21 * * *'
  workflow_dispatch:
concurrency:
  group: lulea-ais-pilot
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  ais-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/ais_probe.py
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
      - name: Commit aggregated pilot output
        run: |
          if [ ! -d data/ais_probe ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ais_probe
          if ! git diff --cached --quiet; then
            git commit -m "Archive AIS coverage pilot"
            git push
          fi
