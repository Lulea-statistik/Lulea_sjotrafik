name: Daily port snapshot
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lulea-sjotrafik-daily
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/snapshot.py
      - run: python scripts/publish_data.py
      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/snapshots data/raw data/cruise/snapshots data/cruise/raw docs/data
          if ! git diff --cached --quiet; then
            git commit -m "Archive Lulea port listing"
            git push
          fi
