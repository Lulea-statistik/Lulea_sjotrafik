name: Test future axis and compact AIS
on:
  pull_request:
    paths:
      - docs/index.html
      - tests/future-axis-ais-compact.test.cjs
      - .github/workflows/test-future-axis-ais-compact.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/future-axis-ais-compact.test.cjs
