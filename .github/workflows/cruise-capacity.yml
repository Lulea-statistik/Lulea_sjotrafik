name: Daily cruise passenger capacity check
on:
  workflow_dispatch:
  schedule:
    - cron: "29 5 * * *"
permissions:
  contents: write
concurrency:
  group: cruise-capacity-daily
  cancel-in-progress: false
jobs:
  capacity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/update_cruise_capacity.py
      - name: Publish capacity data for GitHub Pages
        run: |
          mkdir -p docs/data/cruise
          cp data/cruise/passenger_capacity.json docs/data/cruise/passenger_capacity.json
      - name: Commit verified metadata and source availability
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cruise/passenger_capacity.json docs/data/cruise/passenger_capacity.json
          if ! git diff --cached --quiet; then
            git commit -m "Kontrollera kryssningsfartygens kapacitet"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
