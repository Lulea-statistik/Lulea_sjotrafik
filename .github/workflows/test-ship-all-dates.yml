name: Test ship all dates aggregate
on:
  pull_request:
    paths:
      - docs/index.html
      - tests/ship-all-dates.test.cjs
      - .github/workflows/test-ship-all-dates.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/ship-all-dates.test.cjs
