name: Test ship snapshot and AIS hourly samples
on:
  pull_request:
    paths:
      - docs/index.html
      - tests/ship-snapshot-and-ais-sample-count.test.cjs
      - .github/workflows/test-ship-snapshot-hourly-samples.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/ship-snapshot-and-ais-sample-count.test.cjs
